version: '3.8'

services:
  mariadb:
    image: mariadb:10.6
    container_name: exrp-mariadb
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/frappe.cnf:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    container_name: exrp-redis-cache
    restart: unless-stopped
    ports:
      - "12000:6379"

  redis-queue:
    image: redis:7-alpine
    container_name: exrp-redis-queue
    restart: unless-stopped
    ports:
      - "11000:6379"

volumes:
  mariadb_data:
